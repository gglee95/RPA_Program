# 프로젝트명 명시 — 컨테이너 폴더명에 한글이 포함되어 있어
# docker compose가 자동 추출에 실패하기 때문 (project name must not be empty)
name: mango-uploader

services:
  uploader:
    build:
      context: .
      dockerfile: Dockerfile
    image: mango-uploader:latest
    container_name: mango-uploader
    # Chromium 은 IPC/shm 용량을 많이 씀 — 기본 64MB 로는 부족함
    shm_size: 2gb
    # SIGTERM 받아서 깔끔히 종료되도록 init 사용
    init: true
    environment:
      MANGO_STATE_DIR: /state
      SERVICE_ACCOUNT_JSON: /secrets/service_account.json
      TZ: Asia/Seoul
      LANG: C.UTF-8
      CHROME_BIN: /usr/bin/chromium
    volumes:
      # nd-profile / downloads / logs 영속화. 호스트의 ./state 디렉토리에 저장됨.
      - ./state:/state
      # 서비스 계정 JSON. 호스트에서 secrets/service_account.json 으로 배치.
      - ./secrets/service_account.json:/secrets/service_account.json:ro
    # 다른 명령으로 실행하려면 command 오버라이드:
    # command: ["python", "upload_mangocar.py", "--rows", "180-200"]
